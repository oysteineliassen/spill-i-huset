name: Spill i huset

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Bygg APK
        run: ./gradlew assembleRelease --console=plain
      - name: Gi APK-en et navn med versjon
        run: cp app/build/outputs/apk/release/app-release.apk "SpillIHuset-1.0.${GITHUB_RUN_NUMBER}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SpillIHuset-1.0.${{ github.run_number }}
          path: SpillIHuset-1.0.${{ github.run_number }}.apk
          retention-days: 7
      # Siste APK fra main legges også på grenen "apk" (én commit, overskrives hver gang)
      - name: Publiser APK på grenen apk
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/apk && cp "SpillIHuset-1.0.${GITHUB_RUN_NUMBER}.apk" /tmp/apk/SpillIHuset.apk
          cd /tmp/apk
          echo "Spill i huset 1.0.${GITHUB_RUN_NUMBER} ($(date -u +%F)) fra ${GITHUB_SHA}" > VERSION.txt
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Spill i huset 1.0.${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
